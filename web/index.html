<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GPUBeat</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.min.css">
    <script src="https://cdn.jsdelivr.net/npm/vue@2.7.16/dist/vue.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.min.js"></script>
    <style>
        :root {
            --bg-primary: #1e2a3a;
            --bg-secondary: #2b3d52;
            --bg-nav: #243447;
            --bg-nav-btn: #334d66;
            --text-nav: #c8d6e0;
            --text-nav-title: #fff;
            --border-nav-btn: #4a6278;
            --text-primary: #e0e8ed;
            --text-secondary: #a0b4c4;
            --text-muted: #7f95a5;
            --border-color: #3d5570;
            --border-light: rgba(255,255,255,0.07);
            --hover-bg: rgba(255,255,255,0.06);
            --shadow: rgba(0,0,0,0.2);
            --chart-bg: #2b3d52;
            --terminal-bg: #111820;
            --terminal-panel: #172231;
            --progress-bar: #27ae60;
            --progress-track: rgba(255,255,255,0.08);
        }
        [data-theme="light"] {
            --bg-primary: #f0f2f5;
            --bg-secondary: #ffffff;
            --bg-nav: #ffffff;
            --bg-nav-btn: #f0f2f5;
            --text-nav: #636e72;
            --text-nav-title: #2c3e50;
            --border-nav-btn: #dfe6e9;
            --text-primary: #2c3e50;
            --text-secondary: #636e72;
            --text-muted: #9aa3a8;
            --border-color: #dfe6e9;
            --border-light: #f0f0f0;
            --hover-bg: rgba(0,0,0,0.03);
            --shadow: rgba(0,0,0,0.18);
            --chart-bg: #ffffff;
            --terminal-bg: #0f1720;
            --terminal-panel: #ffffff;
            --progress-bar: #27ae60;
            --progress-track: rgba(0,0,0,0.16);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow-x: hidden;
        }
        button, input, select { font: inherit; }
        .navbar {
            background: var(--bg-nav);
            padding: 10px 24px;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            box-shadow: 0 2px 10px var(--shadow);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .title {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-nav-title);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .progress-ring { width: 18px; height: 18px; transform: rotate(-90deg); flex-shrink: 0; }
        .progress-ring__circle { stroke: var(--progress-bar); fill: none; }
        .center { display: flex; flex-direction: column; align-items: center; color: var(--text-nav); }
        .clock-main { font-size: 15px; font-weight: 600; }
        .clock-sub { font-size: 11px; opacity: 0.65; margin-top: 1px; }
        .error-badge { background: #e67e22; color: #fff; padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; margin-top: 3px; }
        .controls { display: flex; align-items: center; gap: 8px; white-space: nowrap; justify-self: end; }
        .controls select, .controls input, .terminal-select {
            padding: 5px 8px;
            border-radius: 4px;
            border: 1px solid var(--border-nav-btn);
            background: var(--bg-nav-btn);
            color: var(--text-primary);
            font-size: 13px;
        }
        .controls select { min-width: 140px; }
        .controls input { width: 54px; text-align: center; }
        .btn {
            padding: 6px 12px;
            border-radius: 4px;
            border: 1px solid transparent;
            cursor: pointer;
            background: #27ae60;
            color: #fff;
            font-size: 13px;
            transition: opacity 0.2s, background 0.2s;
        }
        .btn:hover { opacity: 0.9; }
        .btn.secondary { background: var(--bg-nav-btn); border-color: var(--border-nav-btn); color: var(--text-primary); }
        .btn.danger { background: #c0392b; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .section { padding: 16px 24px; }
        .cards-flow { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
        .gpu-card {
            background: var(--bg-secondary);
            border-radius: 8px;
            padding: 14px;
            box-shadow: 0 2px 8px var(--shadow);
            border-left: 4px solid transparent;
            min-height: 118px;
            display: flex;
            flex-direction: column;
        }
        .card-gpu-name { font-size: 13px; font-weight: 650; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
        .gpu-idx { font-size: 12px; opacity: 0.7; }
        .card-metrics { display: flex; justify-content: space-between; gap: 6px; }
        .card-metric { text-align: center; flex: 1; min-width: 50px; }
        .card-metric .val { font-size: 22px; font-weight: 700; line-height: 1.2; }
        .card-metric .lbl { font-size: 11px; opacity: 0.7; }
        .card-users { margin-top: auto; padding-top: 8px; font-size: 12px; opacity: 0.85; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-height: 18px; }
        .host-tag { display: inline-block; width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
        .temp-high, .mem-high { color: #e74c3c; }
        .temp-mid, .mem-mid { color: #f39c12; }
        .temp-low { color: #2ecc71; }
        .mem-low { color: var(--text-primary); }
        .table-wrapper { overflow-x: auto; border-radius: 8px; box-shadow: 0 2px 10px var(--shadow); }
        table { width: 100%; border-collapse: collapse; background: var(--bg-secondary); table-layout: fixed; min-width: 1100px; }
        thead { background: var(--bg-primary); }
        th { padding: 12px 14px; text-align: left; font-size: 13px; font-weight: 700; border-bottom: 3px solid var(--border-color); white-space: nowrap; }
        td { padding: 9px 12px; font-size: 13px; border-bottom: 1px solid var(--border-light); vertical-align: middle; }
        tr:hover td { background: var(--hover-bg); }
        .host-row td { background: var(--bg-primary); border-top: 3px solid var(--border-color); font-weight: 700; }
        .host-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
        .status { font-size: 11px; padding: 2px 8px; border-radius: 8px; }
        .status.online { background: rgba(39,174,96,0.18); color: #2ecc71; }
        .status.error { background: rgba(231,76,60,0.18); color: #e74c3c; }
        .muted { color: var(--text-muted); }
        .mem-bar { display: inline-block; width: 120px; height: 12px; background: var(--progress-track); border-radius: 6px; overflow: hidden; vertical-align: middle; margin-left: 8px; }
        .mem-bar-inner { display: block; height: 100%; border-radius: 6px; transition: width 0.4s ease; }
        .charts-section { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; padding: 4px 24px 16px; }
        .chart-container { background: var(--chart-bg); border-radius: 8px; padding: 16px; box-shadow: 0 2px 10px var(--shadow); }
        .chart-container h3, .terminal-title { font-size: 15px; margin-bottom: 12px; color: var(--text-primary); }
        .chart-box { height: 320px; }
        .terminal-section { padding: 4px 24px 20px; }
        .terminal-panel { background: var(--terminal-panel); border: 1px solid var(--border-color); border-radius: 8px; box-shadow: 0 2px 10px var(--shadow); overflow: hidden; }
        .terminal-toolbar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 12px;
            border-bottom: 1px solid var(--border-color);
            flex-wrap: wrap;
        }
        .terminal-select { min-width: 180px; }
        .terminal-status { font-size: 12px; color: var(--text-muted); margin-left: auto; }
        .terminal-status.connected { color: #2ecc71; }
        .terminal-status.error { color: #e74c3c; }
        .terminal-box { height: 420px; background: var(--terminal-bg); padding: 8px; }
        .terminal-box .xterm { height: 100%; }
        .empty-state { text-align: center; padding: 56px 20px; color: var(--text-muted); }
        .empty-state .icon { font-size: 44px; margin-bottom: 12px; }
        .footer { text-align: center; padding: 16px; color: var(--text-muted); font-size: 12px; border-top: 1px solid var(--border-color); }
        .footer a { color: var(--text-muted); text-decoration: none; }
        .footer a:hover { color: var(--text-primary); text-decoration: underline; }
        @media (max-width: 768px) {
            .navbar { display: flex; flex-wrap: wrap; padding: 8px 12px; gap: 6px; }
            .center { flex-direction: row; gap: 8px; margin-left: auto; }
            .controls { width: 100%; flex-wrap: wrap; justify-content: flex-start; }
            .controls select { min-width: 0; flex: 1; }
            .section, .terminal-section { padding-left: 12px; padding-right: 12px; }
            .charts-section { grid-template-columns: 1fr; padding-left: 12px; padding-right: 12px; }
            .chart-box { height: 260px; }
            .terminal-box { height: 360px; }
            .terminal-status { width: 100%; margin-left: 0; }
        }
    </style>
</head>
<body>
<div id="app">
    <div class="navbar">
        <div class="title">
            GPUBeat
            <svg class="progress-ring" viewBox="0 0 18 18">
                <circle cx="9" cy="9" r="7" stroke="var(--progress-track)" stroke-width="2" fill="none"></circle>
                <circle class="progress-ring__circle" ref="progressRing" cx="9" cy="9" r="7" stroke-width="2" stroke-dasharray="43.98" stroke-dashoffset="43.98" stroke-linecap="round"></circle>
            </svg>
        </div>
        <div class="center">
            <span class="clock-main">{{ currentDate }} {{ currentTime }}</span>
            <span class="clock-sub">{{ refreshAgo }}s ago</span>
            <span v-if="errorCount > 0" class="error-badge">{{ errorCount }} errors</span>
        </div>
        <div class="controls">
            <select v-model="selectedHost">
                <option value="all">All hosts</option>
                <option v-for="h in hostOptions" :key="h.hostname" :value="h.hostname">{{ h.name }}</option>
            </select>
            <span style="color:var(--text-nav)">Interval</span>
            <input type="number" v-model.number="refreshInterval" min="1" max="60">
            <button class="btn" @click="fetchData">Refresh</button>
            <button class="btn secondary" @click="toggleTheme">{{ theme === 'dark' ? 'Light' : 'Dark' }}</button>
        </div>
    </div>

    <div v-if="filteredStats.length === 0 && !update_time" class="empty-state">
        <div class="icon">GPU</div>
        <p>Waiting for GPU data...</p>
    </div>

    <div class="section" v-if="filteredStats.length > 0">
        <div class="cards-flow">
            <template v-for="(host, hi) in filteredStats">
                <div v-if="host.status === 'error'" :key="host.hostname + '-err'" class="gpu-card" :style="{'border-left-color': '#e74c3c'}">
                    <div class="card-gpu-name">
                        <span class="host-tag" :style="{background: hostColor(hi)}"></span>
                        {{ host.hostname }}
                    </div>
                    <div style="color:#e74c3c;font-size:13px">{{ host.error || 'Host unavailable' }}</div>
                </div>
                <div v-else v-for="gpu in host.gpus" :key="host.hostname + '-' + gpu.index" class="gpu-card" :style="{'border-left-color': hostColor(hi)}">
                    <div class="card-gpu-name">
                        <span class="host-tag" :style="{background: hostColor(hi)}"></span>
                        <span class="gpu-idx">[{{ gpu.index }}]</span> {{ gpu.name || '-' }}
                    </div>
                    <div class="card-metrics">
                        <div class="card-metric">
                            <div class="val" :class="tempClass(gpu['temperature.gpu'])">{{ gpu['temperature.gpu'] || 0 }}C</div>
                            <div class="lbl">Temp</div>
                        </div>
                        <div class="card-metric">
                            <div class="val" :class="memClass(gpu.memory)">{{ gpu.memory || 0 }}%</div>
                            <div class="lbl">VRAM</div>
                        </div>
                        <div class="card-metric">
                            <div class="val">{{ gpu['utilization.gpu'] || 0 }}%</div>
                            <div class="lbl">Util</div>
                        </div>
                    </div>
                    <div class="card-users">
                        <template v-if="gpu.user_processes && gpu.user_processes !== '-'">{{ gpu.user_processes }}</template>
                        <span v-else class="muted">No GPU processes</span>
                    </div>
                </div>
            </template>
        </div>
    </div>

    <div class="section" v-if="filteredStats.length > 0">
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th style="width:260px">GPU</th>
                        <th style="width:130px">Temperature</th>
                        <th style="width:130px">Utilization</th>
                        <th style="width:260px">VRAM</th>
                        <th style="width:150px">Power</th>
                        <th>Users</th>
                    </tr>
                </thead>
                <tbody>
                    <template v-for="(host, hi) in filteredStats">
                        <tr class="host-row">
                            <td colspan="6">
                                <div class="host-meta">
                                    <span class="host-tag" :style="{background: hostColor(hi)}"></span>
                                    <span>{{ host.hostname }}</span>
                                    <span class="status" :class="host.status">{{ host.status }}</span>
                                    <span v-if="host.status === 'online' && host.gpus" class="muted">{{ host.gpus.length }} GPUs</span>
                                    <span v-if="host.status === 'online' && host.sys" class="muted">CPU {{ fmtPercent(host.sys.cpu_usage) }} · MEM {{ fmtMemMB(host.sys.mem_used) }}/{{ fmtMemMB(host.sys.mem_total) }} · Load {{ fmtLoad(host.sys.load_1) }}</span>
                                    <span v-if="host.status === 'error'" style="color:#e74c3c">{{ host.error }}</span>
                                </div>
                            </td>
                        </tr>
                        <tr v-for="gpu in host.gpus" :key="host.hostname + '-' + gpu.index">
                            <td><span class="host-tag" :style="{background: hostColor(hi)}"></span> [{{ gpu.index }}] {{ gpu.name || '-' }}</td>
                            <td :class="tempClass(gpu['temperature.gpu'])">{{ gpu['temperature.gpu'] || 0 }}C</td>
                            <td>{{ gpu['utilization.gpu'] || 0 }}%</td>
                            <td :class="memClass(gpu.memory)">
                                {{ fmtGB(gpu['memory.used'] || 0) }} / {{ fmtGB(gpu['memory.total'] || 0) }} ({{ gpu.memory || 0 }}%)
                                <span class="mem-bar"><span class="mem-bar-inner" :style="{width: (gpu.memory || 0) + '%', background: barColor(gpu.memory)}"></span></span>
                            </td>
                            <td>{{ gpu['power.draw'] || '-' }} / {{ gpu['enforced.power.limit'] || '-' }} W</td>
                            <td>{{ gpu.user_processes || '-' }}</td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </div>
    </div>

    <div class="charts-section" v-if="filteredStats.length > 0">
        <div class="chart-container">
            <h3>User VRAM Usage</h3>
            <div class="chart-box" id="barChart"></div>
        </div>
        <div class="chart-container">
            <h3>GPU VRAM Share</h3>
            <div class="chart-box" id="pieChart"></div>
        </div>
    </div>

    <div class="terminal-section">
        <div class="terminal-panel">
            <div class="terminal-toolbar">
                <strong class="terminal-title" style="margin-bottom:0">Web Terminal</strong>
                <select class="terminal-select" v-model="terminalHost" :disabled="terminalConnected">
                    <option value="">Select host</option>
                    <option v-for="h in hostOptions" :key="'term-' + h.hostname" :value="h.hostname">{{ h.name }}</option>
                </select>
                <button class="btn" @click="connectTerminal" :disabled="terminalConnected || !terminalHost">Connect</button>
                <button class="btn danger" @click="disconnectTerminal" :disabled="!terminalConnected">Disconnect</button>
                <button class="btn secondary" @click="clearTerminal">Clear</button>
                <span class="terminal-status" :class="{connected: terminalConnected, error: terminalStatusType === 'error'}">{{ terminalStatus }}</span>
            </div>
            <div class="terminal-box" ref="terminalBox"></div>
        </div>
    </div>

    <div class="footer">
        {{ update_time || 'No data yet' }} &nbsp;|&nbsp;
        <a href="https://github.com/jysir99/gpubeat" target="_blank">GitHub</a> &nbsp;|&nbsp;
        GPUBeat
    </div>
</div>

<script>
var HOST_COLORS = ['#3498db', '#e74c3c', '#2ecc71', '#f39c12', '#9b59b6', '#1abc9c', '#e67e22', '#e84393'];

new Vue({
    el: '#app',
    data: {
        gpustats: [],
        update_time: '',
        currentTime: '',
        currentDate: '',
        refreshAgo: 0,
        lastFetchTime: Date.now(),
        refreshInterval: 3,
        selectedHost: 'all',
        theme: 'light',
        timer: null,
        clockTimer: null,
        progressTimer: null,
        barChart: null,
        pieChart: null,
        barHash: '',
        pieHash: '',
        terminal: null,
        terminalFit: null,
        terminalSocket: null,
        terminalHost: '',
        terminalConnected: false,
        terminalStatus: 'Disconnected',
        terminalStatusType: '',
        terminalResizeTimer: null
    },
    computed: {
        filteredStats: function() {
            if (this.selectedHost === 'all') return this.gpustats;
            var target = this.selectedHost;
            return this.gpustats.filter(function(h) { return h.hostname === target; });
        },
        hostOptions: function() {
            return this.gpustats.map(function(h) { return { name: h.hostname, hostname: h.hostname }; });
        },
        errorCount: function() {
            return this.gpustats.filter(function(h) { return h.status === 'error'; }).length;
        }
    },
    mounted: function() {
        var saved = localStorage.getItem('gpu-theme');
        if (saved) {
            this.theme = saved;
            document.documentElement.setAttribute('data-theme', saved);
        }
        this.startClock();
        this.fetchData();
        this.startAutoRefresh();
        this.initTerminal();
        var self = this;
        window.addEventListener('resize', function() {
            if (self.barChart) self.barChart.resize();
            if (self.pieChart) self.pieChart.resize();
            self.fitTerminal();
        });
    },
    beforeDestroy: function() {
        this.stopAutoRefresh();
        this.stopProgress();
        this.stopClock();
        this.disconnectTerminal();
    },
    methods: {
        fmtMemMB: function(mb) {
            if (!mb || mb <= 0) return '0 MB';
            if (mb >= 1024) return (mb / 1024).toFixed(1) + ' GB';
            return Math.round(mb) + ' MB';
        },
        fmtGB: function(mb) {
            if (!mb && mb !== 0) return '-';
            return (mb / 1024).toFixed(2) + ' GB';
        },
        fmtPercent: function(value) {
            return value || value === 0 ? Number(value).toFixed(1) + '%' : '-';
        },
        fmtLoad: function(value) {
            return value || value === 0 ? Number(value).toFixed(2) : '-';
        },
        barColor: function(pct) {
            if (pct > 70) return '#e74c3c';
            if (pct > 30) return '#f39c12';
            return '#2ecc71';
        },
        tempClass: function(t) {
            if (!t) return '';
            if (t > 70) return 'temp-high';
            if (t > 40) return 'temp-mid';
            return 'temp-low';
        },
        memClass: function(pct) {
            if (pct > 70) return 'mem-high';
            if (pct > 30) return 'mem-mid';
            return 'mem-low';
        },
        hostColor: function(index) {
            return HOST_COLORS[index % HOST_COLORS.length];
        },
        hostColorByName: function(hostname) {
            for (var i = 0; i < this.gpustats.length; i++) {
                if (this.gpustats[i].hostname === hostname) return this.hostColor(i);
            }
            return HOST_COLORS[0];
        },
        startClock: function() {
            var self = this;
            function tick() {
                var now = new Date();
                self.currentDate = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');
                self.currentTime = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0') + ':' + String(now.getSeconds()).padStart(2, '0');
                self.refreshAgo = Math.floor((Date.now() - self.lastFetchTime) / 1000);
            }
            tick();
            this.clockTimer = setInterval(tick, 1000);
        },
        stopClock: function() {
            if (this.clockTimer) {
                clearInterval(this.clockTimer);
                this.clockTimer = null;
            }
        },
        fetchData: function() {
            var self = this;
            this.stopProgress();
            if (self.$refs.progressRing) {
                self.$refs.progressRing.style.strokeDashoffset = '43.98';
            }
            requestAnimationFrame(function() { self.startProgress(); });
            fetch('/api/gpustats')
                .then(function(r) { return r.json(); })
                .then(function(data) {
                    self.gpustats = data.gpustats || [];
                    self.update_time = data.update_time || '';
                    self.lastFetchTime = Date.now();
                    if (!self.terminalHost && self.gpustats.length > 0) {
                        self.terminalHost = self.gpustats[0].hostname;
                    }
                    self.$nextTick(function() {
                        self.updateCharts();
                        self.fitTerminal();
                    });
                })
                .catch(function(err) {
                    console.error(err);
                    self.terminalStatus = 'Data refresh failed';
                    self.terminalStatusType = 'error';
                });
        },
        startAutoRefresh: function() {
            this.stopAutoRefresh();
            var self = this;
            this.timer = setInterval(function() { self.fetchData(); }, Math.max(1, this.refreshInterval) * 1000);
        },
        stopAutoRefresh: function() {
            if (this.timer) {
                clearInterval(this.timer);
                this.timer = null;
            }
        },
        startProgress: function() {
            var self = this;
            var start = Date.now();
            var total = Math.max(1, this.refreshInterval) * 1000;
            this.progressTimer = setInterval(function() {
                var pct = Math.min((Date.now() - start) / total, 1);
                if (self.$refs.progressRing) {
                    self.$refs.progressRing.style.strokeDashoffset = String(43.98 * (1 - pct));
                }
            }, 100);
        },
        stopProgress: function() {
            if (this.progressTimer) {
                clearInterval(this.progressTimer);
                this.progressTimer = null;
            }
        },
        toggleTheme: function() {
            this.theme = this.theme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', this.theme);
            localStorage.setItem('gpu-theme', this.theme);
            this.barHash = '';
            this.pieHash = '';
            this.updateCharts();
        },
        chartTextColor: function() {
            return this.theme === 'dark' ? '#a0b4c4' : '#636e72';
        },
        chartLineColor: function() {
            return this.theme === 'dark' ? '#3d5570' : '#e0e0e0';
        },
        updateCharts: function() {
            this.updateBarChart();
            this.updatePieChart();
        },
        updateBarChart: function() {
            var el = document.getElementById('barChart');
            if (!el) return;
            var userData = {};
            var hostOrder = [];
            this.filteredStats.forEach(function(host) {
                if (host.status === 'error') return;
                hostOrder.push(host.hostname);
                (host.gpus || []).forEach(function(gpu) {
                    (gpu.processes || []).forEach(function(proc) {
                        var u = proc.username;
                        if (!u || u === 'unknown' || u === 'root') return;
                        if (!userData[u]) userData[u] = {};
                        userData[u][host.hostname] = (userData[u][host.hostname] || 0) + proc.gpu_memory_usage;
                    });
                });
            });
            var users = Object.keys(userData).sort(function(a, b) {
                var ta = 0, tb = 0;
                Object.keys(userData[a]).forEach(function(k) { ta += userData[a][k]; });
                Object.keys(userData[b]).forEach(function(k) { tb += userData[b][k]; });
                return tb - ta;
            });
            var hash = JSON.stringify({users: users, hosts: hostOrder, data: userData, theme: this.theme});
            if (hash === this.barHash && this.barChart) return;
            this.barHash = hash;
            if (!this.barChart) this.barChart = echarts.init(el);
            if (users.length === 0) {
                this.barChart.clear();
                this.barChart.setOption({ title: { text: 'No process data', left: 'center', top: 'center', textStyle: { color: this.chartTextColor(), fontSize: 14 } } }, true);
                return;
            }
            var self = this;
            var series = hostOrder.map(function(h) {
                return {
                    name: h,
                    type: 'bar',
                    stack: 'mem',
                    data: users.map(function(u) { return ((userData[u][h] || 0) / 1024).toFixed(2); }),
                    itemStyle: { color: self.hostColorByName(h) }
                };
            });
            this.barChart.setOption({
                tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
                legend: { top: 0, textStyle: { color: self.chartTextColor(), fontSize: 11 }, type: 'scroll' },
                grid: { left: 70, right: 20, top: 36, bottom: 80 },
                xAxis: { type: 'category', data: users, axisLabel: { color: self.chartTextColor(), rotate: 45, fontSize: 11 } },
                yAxis: { type: 'value', name: 'GB', nameTextStyle: { color: self.chartTextColor() }, axisLabel: { color: self.chartTextColor() }, splitLine: { lineStyle: { color: self.chartLineColor() } } },
                series: series
            }, true);
        },
        updatePieChart: function() {
            var el = document.getElementById('pieChart');
            if (!el) return;
            var self = this;
            var data = [];
            this.filteredStats.forEach(function(host, hi) {
                if (host.status === 'error') return;
                (host.gpus || []).forEach(function(gpu) {
                    data.push({
                        name: host.hostname + ' GPU ' + gpu.index,
                        value: gpu['memory.used'] || 0,
                        itemStyle: { color: self.hostColor(hi) }
                    });
                });
            });
            var hash = JSON.stringify({data: data, theme: this.theme});
            if (hash === this.pieHash && this.pieChart) return;
            this.pieHash = hash;
            if (!this.pieChart) this.pieChart = echarts.init(el);
            if (data.length === 0) {
                this.pieChart.clear();
                this.pieChart.setOption({ title: { text: 'No GPU data', left: 'center', top: 'center', textStyle: { color: this.chartTextColor(), fontSize: 14 } } }, true);
                return;
            }
            this.pieChart.setOption({
                tooltip: { trigger: 'item', formatter: function(p) { return p.name + '<br>' + (p.value / 1024).toFixed(2) + ' GB'; } },
                legend: { orient: 'vertical', right: 10, top: 'center', textStyle: { color: self.chartTextColor(), fontSize: 11 }, type: 'scroll' },
                series: [{
                    type: 'pie',
                    radius: ['42%', '70%'],
                    center: ['40%', '50%'],
                    label: { color: self.chartTextColor(), fontSize: 11 },
                    data: data
                }]
            }, true);
        },
        initTerminal: function() {
            if (!window.Terminal || !this.$refs.terminalBox) {
                this.terminalStatus = 'Terminal assets failed to load';
                this.terminalStatusType = 'error';
                return;
            }
            this.terminalFit = new FitAddon.FitAddon();
            this.terminal = new Terminal({
                cursorBlink: true,
                convertEol: true,
                fontFamily: 'Consolas, "Cascadia Mono", monospace',
                fontSize: 13,
                theme: { background: '#0f1720', foreground: '#d6e2ee' }
            });
            this.terminal.loadAddon(this.terminalFit);
            this.terminal.open(this.$refs.terminalBox);
            this.terminal.writeln('GPUBeat terminal ready. Select a host and connect.');
            var self = this;
            this.terminal.onData(function(data) {
                if (self.terminalSocket && self.terminalSocket.readyState === WebSocket.OPEN) {
                    self.terminalSocket.send(JSON.stringify({ type: 'input', data: data }));
                }
            });
            this.fitTerminal();
        },
        fitTerminal: function() {
            var self = this;
            clearTimeout(this.terminalResizeTimer);
            this.terminalResizeTimer = setTimeout(function() {
                if (!self.terminalFit || !self.terminal) return;
                self.terminalFit.fit();
                if (self.terminalSocket && self.terminalSocket.readyState === WebSocket.OPEN) {
                    self.terminalSocket.send(JSON.stringify({ type: 'resize', cols: self.terminal.cols, rows: self.terminal.rows }));
                }
            }, 80);
        },
        connectTerminal: function() {
            if (!this.terminal || !this.terminalHost || this.terminalConnected) return;
            var protocol = window.location.protocol === 'https:' ? 'wss://' : 'ws://';
            var url = protocol + window.location.host + '/api/terminal?host=' + encodeURIComponent(this.terminalHost) + '&cols=' + this.terminal.cols + '&rows=' + this.terminal.rows;
            var self = this;
            this.terminalStatus = 'Connecting to ' + this.terminalHost + '...';
            this.terminalStatusType = '';
            this.terminalSocket = new WebSocket(url);
            this.terminalSocket.onopen = function() {
                self.terminalConnected = true;
                self.terminalStatus = 'Connected to ' + self.terminalHost;
                self.terminalStatusType = '';
                self.terminal.writeln('\r\nConnected to ' + self.terminalHost);
                self.fitTerminal();
            };
            this.terminalSocket.onmessage = function(event) {
                var msg;
                try {
                    msg = JSON.parse(event.data);
                } catch (err) {
                    self.terminal.write(event.data);
                    return;
                }
                if (msg.type === 'output') {
                    self.terminal.write(msg.data || '');
                } else if (msg.type === 'error') {
                    self.terminal.writeln('\r\n' + (msg.data || 'Terminal error'));
                    self.terminalStatus = msg.data || 'Terminal error';
                    self.terminalStatusType = 'error';
                } else if (msg.type === 'close') {
                    self.terminal.writeln('\r\nSession closed.');
                }
            };
            this.terminalSocket.onerror = function() {
                self.terminalStatus = 'Connection failed. Check server.terminal.enabled.';
                self.terminalStatusType = 'error';
            };
            this.terminalSocket.onclose = function() {
                self.terminalConnected = false;
                if (self.terminalStatusType !== 'error') {
                    self.terminalStatus = 'Disconnected';
                }
            };
        },
        disconnectTerminal: function() {
            if (this.terminalSocket) {
                if (this.terminalSocket.readyState === WebSocket.OPEN) {
                    this.terminalSocket.send(JSON.stringify({ type: 'close' }));
                }
                this.terminalSocket.close();
                this.terminalSocket = null;
            }
            this.terminalConnected = false;
        },
        clearTerminal: function() {
            if (this.terminal) this.terminal.clear();
        }
    },
    watch: {
        refreshInterval: function() {
            this.startAutoRefresh();
        },
        selectedHost: function() {
            this.barHash = '';
            this.pieHash = '';
            var self = this;
            this.$nextTick(function() { self.updateCharts(); });
        }
    }
});
</script>
</body>
