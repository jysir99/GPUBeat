server:
  host: "0.0.0.0"
  port: 9988
  refresh: 3
  privacy: false
  terminal:
    enabled: false  # Set true to enable browser SSH terminals for configured hosts.
    token: ""        # Optional shared token required by the Web Terminal.

hosts:
  - name: "gpu-server-1"
    host: "192.168.1.100"
    port: 22
    username: "root"
    password: "your-password"
    provider: "Tencent Cloud"
    region: "ap-guangzhou"
    notes: "GPU or general Linux host monitored over SSH"

